name: Build Android Apktool DEX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build shadowJar
        run: ./gradlew :brut.apktool:apktool-cli:shadowJar -x test --no-daemon

      - name: Convert to DEX and package JAR
        run: |
          RAW_JAR=$(find brut.apktool/apktool-cli/build/libs/ -name "*-all.jar" | head -n 1)
          cp "$RAW_JAR" apktool_android.jar
          
          D8_BIN=$(find $ANDROID_HOME/build-tools/ -name "d8" | sort -V | tail -n 1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
          
          mkdir dex_out
          "$D8_BIN" --release --min-api 35 --lib "$ANDROID_JAR" --output dex_out apktool_android.jar
          
          zip -d apktool_android.jar "*.class" "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" "prebuilt/windows/*" "prebuilt/macosx/*"
          cd dex_out
          zip -u ../apktool_android.jar classes*.dex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apktool-android-17
          path: apktool_android.jar
