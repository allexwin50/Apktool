name: Build Apktool DEX for Android

on:
  workflow_dispatch:

jobs:
  build-dex:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código da branch main
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar shadowJar do Apktool
        run: ./gradlew :brut.apktool:apktool-cli:shadowJar -x test --no-daemon

      - name: Converter para DEX (API 35+ com SDK mais recente)
        run: |
          RAW_JAR=$(find brut.apktool/apktool-cli/build/libs/ -name "*-all.jar" | head -n 1)
          cp "$RAW_JAR" apktool_android.jar
          
          # Localiza o d8 e o android.jar mais recentes instalados no runner do GitHub
          D8_BIN=$(find $ANDROID_HOME/build-tools/ -name "d8" | sort -V | tail -n 1)
          ANDROID_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
          
          mkdir dex_out
          "$D8_BIN" --release --min-api 35 --lib "$ANDROID_JAR" --output dex_out apktool_android.jar
          
          7z d -r apktool_android.jar "*.class" "META-INF/*.SF" "META-INF/*.DSA" "META-INF/*.RSA" "prebuilt/windows/*" "prebuilt/macosx/*"
          7z a -tzip apktool_android.jar ./dex_out/classes*.dex

      - name: Disponibilizar apktool_android.jar para Download
        uses: actions/upload-artifact@v4
        with:
          name: apktool-3.1.0-android-dex
          path: apktool_android.jar
